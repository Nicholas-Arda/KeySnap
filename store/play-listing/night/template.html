<title>KeySnap Store Deck, Night</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,500,1,0&display=block">
<style>
  :root {
    --ui-bg: #f5f4f0; --ui-fg: #1c1c1e; --ui-muted: #6b6a66; --ui-line: #dedbd2; --ui-accent: #0b57d0;
    /* slide palette: fixed, this is artwork */
    --navy: #0b1220; --navy-2: #131e31; --navy-3: #1c2a40; --paper: #f5f1e8; --paper-2: #a9a49a;
    --blue: #409cff; --blue-hot: #006efd; --bezel: #050810; --cream: #f5f1e8; --cream-ink: #1c1c1e; --cream-2: #5b5a56;
    --sepia-bg: #f4e9d5; --sepia-amber: #8b5a2b; --sepia-line: #c8ae80;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ui-bg: #14161b; --ui-fg: #ecebe6; --ui-muted: #9a9892; --ui-line: #2a2d34; --ui-accent: #409cff; }
  }
  :root[data-theme="dark"] { --ui-bg: #14161b; --ui-fg: #ecebe6; --ui-muted: #9a9892; --ui-line: #2a2d34; --ui-accent: #409cff; }

  body { background: var(--ui-bg); color: var(--ui-fg); font-family: Figtree, "Segoe UI", system-ui, sans-serif; margin: 0; }
  .bar { display: flex; align-items: baseline; gap: 20px; padding: 18px 24px 6px; flex-wrap: wrap; }
  .bar h1 { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .bar p { margin: 0; color: var(--ui-muted); font-size: 13px; }
  .bar label { margin-left: auto; font-size: 13px; color: var(--ui-muted); display: flex; gap: 10px; align-items: center; }
  .bar input { accent-color: var(--ui-accent); }
  .deck { display: flex; gap: 20px; overflow-x: auto; padding: 14px 24px 28px; align-items: flex-start; }
  .thumb { flex: none; position: relative; margin: 0; }
  .thumb figcaption { font-size: 12px; color: var(--ui-muted); margin-top: 8px; display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  .thumb figcaption b { color: var(--ui-fg); font-weight: 700; }
  .frame { width: calc(1080px * var(--s, .3)); height: calc(1920px * var(--s, .3)); overflow: hidden; border-radius: 6px; border: 1px solid var(--ui-line); }
  .frame.fg { width: calc(1024px * var(--s, .3)); height: calc(500px * var(--s, .3)); }
  .slide { width: 1080px; height: 1920px; transform: scale(var(--s, .3)); transform-origin: 0 0; position: relative; overflow: hidden; background: var(--navy); color: var(--paper); }
  .slide.feature { width: 1024px; height: 500px; }
  /* stage light behind the phone */
  .slide::before { content: ""; position: absolute; left: 50%; top: 1120px; width: 1500px; height: 1500px; margin-left: -750px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,110,253,.42), rgba(0,110,253,.12) 45%, rgba(0,110,253,0) 70%); pointer-events: none; }
  .slide.cream::before, .slide.feature::before { display: none; }

  /* headline: serif, italic accent */
  .head { position: absolute; left: 70px; right: 70px; top: 130px; text-align: center; z-index: 3; }
  .head h2 { font-family: "Instrument Serif", "Iowan Old Style", Georgia, serif; font-weight: 400; font-size: 124px; line-height: .98; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
  .head h2 em { font-style: italic; color: var(--blue); }
  .head p { font-family: Figtree, sans-serif; font-size: 38px; line-height: 1.3; font-weight: 500; color: var(--paper-2); margin: 30px 70px 0; text-wrap: balance; }

  /* phone */
  .phone { position: absolute; left: 50%; top: 620px; width: 860px; margin-left: -430px; padding: 16px; border-radius: 124px; background: var(--bezel); box-shadow: 0 0 0 2px rgba(64,156,255,.28), 0 60px 120px -30px rgba(0,0,0,.8); z-index: 2; }
  .phone .screen { border-radius: 108px; overflow: hidden; aspect-ratio: 1080 / 2400; background: #000; position: relative; }
  .phone .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .phone .screen::after { content: ""; position: absolute; left: 50%; top: 30px; width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; background: #05070c; box-shadow: 0 0 0 4px rgba(0,0,0,.5); }
  .phone.low { top: 720px; }
  .phone.lower { top: 860px; }
  .phone.fan { width: 470px; margin-left: 0; padding: 12px; border-radius: 80px; top: 470px; z-index: 1; }
  .phone.fan .screen { border-radius: 76px; }
  .phone.fan .screen::after { top: 20px; width: 20px; height: 20px; margin-left: -10px; }
  .phone.fan.l { left: -50px; transform: rotate(-8deg); }
  .phone.fan.r { left: 660px; transform: rotate(8deg); }
  .phone.fan.c { left: 305px; top: 330px; z-index: 2; }

  /* callout pill, dark */
  .pill { position: absolute; left: 50%; transform: translateX(-50%); top: 540px; display: inline-flex; align-items: center; gap: 18px; padding: 20px 34px; border-radius: 999px; background: var(--navy-3); color: var(--paper); font-size: 34px; font-weight: 700; box-shadow: 0 0 0 2px rgba(64,156,255,.35), 0 30px 60px -20px rgba(0,0,0,.8); letter-spacing: -0.01em; white-space: nowrap; z-index: 4; }
  .pill .k { display: inline-grid; place-items: center; min-width: 56px; height: 56px; padding: 0 16px; border-radius: 16px; background: var(--paper); color: var(--navy); font-size: 28px; font-weight: 700; }
  .pill .arrow { color: var(--blue); }

  /* icon tiles */
  .cloud { position: absolute; left: 50%; top: 520px; transform: translateX(-50%); display: grid; grid-template-columns: repeat(5, 132px); gap: 26px; z-index: 3; }
  .cloud span { width: 132px; height: 132px; border-radius: 40px; display: grid; place-items: center; background: var(--navy-3); box-shadow: 0 0 0 2px rgba(64,156,255,.18), 0 24px 40px -20px rgba(0,0,0,.8); }
  .ms, .cloud i { font-family: "Material Symbols Rounded"; font-style: normal; font-size: 72px; line-height: 1; font-variation-settings: "FILL" 1, "wght" 500, "opsz" 48; }

  /* cream brand card */
  .slide.cream { background: var(--cream); color: var(--cream-ink); }
  .slide.cream .head h2 em { color: var(--blue-hot); }
  .slide.cream .head p { color: var(--cream-2); }
  .cream .pieces { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 840px; }
  .cream .facts { position: absolute; left: 80px; right: 80px; bottom: 240px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; text-align: center; }
  .cream .facts div { padding: 40px 18px 34px; border-radius: 36px; background: #fff; box-shadow: 0 24px 50px -24px rgba(11,18,32,.3); }
  .cream .facts .ms { font-size: 96px; color: var(--blue-hot); position: relative; display: inline-block; }
  .cream .facts .ms.strike::after { content: ""; position: absolute; left: -6px; right: -6px; top: 50%; height: 10px; border-radius: 5px; background: #b3261e; transform: rotate(-35deg); box-shadow: 0 0 0 5px #fff; }
  .cream .facts small { display: block; font-size: 26px; line-height: 1.25; font-weight: 600; color: var(--cream-2); margin-top: 18px; text-wrap: balance; }

  /* theme words */
  .head h2 .w-light { color: #fff; text-shadow: 0 0 28px rgba(255,255,255,.7), 0 0 70px rgba(64,156,255,.6); }
  .head h2 .w-dark { color: #0b1220; -webkit-text-stroke: 2.5px #409cff; paint-order: stroke fill; text-shadow: 0 0 34px rgba(64,156,255,.55); }
  .head h2 .w-sepia { color: var(--sepia-amber); background: var(--sepia-bg); box-shadow: 0 0 0 4px var(--sepia-bg), 0 0 0 7px var(--sepia-line); border-radius: 22px; padding: 0 18px; margin: 0 8px; font-style: italic; }

  /* feature graphic */
  .feature { background: var(--navy); }
  .feature .glow { position: absolute; right: -200px; top: -300px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,110,253,.5), rgba(0,110,253,0) 70%); }
  .feature .word { position: absolute; left: 72px; top: 120px; z-index: 2; }
  .feature .word .name { height: 100px; display: block; }
  .feature .word p { font-family: "Instrument Serif", Georgia, serif; font-size: 62px; letter-spacing: -0.02em; margin: 34px 0 0 4px; line-height: 1; color: #fff; }
  .feature .word p em { font-style: italic; color: var(--blue); }
  .feature .fgphone { left: auto; right: -40px; top: 58px; width: 360px; margin-left: 0; padding: 8px; border-radius: 56px; transform: rotate(-8deg); }
  .feature .fgphone .screen { border-radius: 48px; }
  .feature .fgphone .screen::after { top: 12px; width: 12px; height: 12px; margin-left: -6px; }

  body.export { background: transparent; --s: 1; }
  body.export .bar, body.export .thumb { display: none; }
  body.export .thumb.on { display: block; position: fixed; left: 0; top: 0; }
  body.export .thumb.on .frame { border: 0; border-radius: 0; }
  body.export .thumb.on figcaption { display: none; }
  body.export .deck { padding: 0; }
  @media (prefers-reduced-motion: no-preference) { .frame { transition: width .15s, height .15s; } }
</style>

<div class="bar">
  <h1>KeySnap store deck, Night</h1>
  <p>Alternative direction: navy stage, serif headlines, dark-theme screens. Same sizes as the main deck.</p>
  <label>Zoom <input id="zoom" type="range" min="0.15" max="1" step="0.05" value="0.3"></label>
</div>

</div>

<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var id = params.get('slide');
    var zoom = document.getElementById('zoom');
    function setScale(s) { document.documentElement.style.setProperty('--s', s); }
    try { var saved = localStorage.getItem('keysnap-deck-alt-zoom'); if (saved) { zoom.value = saved; } } catch (e) {}
    setScale(zoom.value);
    zoom.addEventListener('input', function () { setScale(zoom.value); try { localStorage.setItem('keysnap-deck-alt-zoom', zoom.value); } catch (e) {} });
    if (id) {
      document.body.classList.add('export');
      setScale(1);
      var el = document.querySelector('.thumb[data-id="' + id + '"]');
      if (el) el.classList.add('on');
    }
  })();
</script>
